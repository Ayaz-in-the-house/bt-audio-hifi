# bt-audio-hifi (PRD-BTA01 F8) — ÜRETİLMİŞ DOSYA, elle düzenleme: `bta bass-apply` yeniden yazar.
# Kaynak tasarım: neutral
# Hedef: user-preference · preamp 0.0 dB (kırpılma koruması: toplam güçlendirmenin tepe değeri kadar)

context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "BT kulaklık bas EQ (bta)"
            media.name       = "BT kulaklık bas EQ (bta)"
            filter.graph = {
                nodes = [
                    {
                        type  = builtin
                        name  = preamp
                        label = linear
                        control = { "Mult" = 1.000000 "Add" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_1
                        label = bq_peaking
                        control = { "Freq" = 40.0 "Q" = 0.9 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_2
                        label = bq_peaking
                        control = { "Freq" = 90.0 "Q" = 1.0 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_3
                        label = bq_peaking
                        control = { "Freq" = 200.0 "Q" = 1.0 "Gain" = 0.0 }
                    }
                ]
                links = [
                    { output = "preamp:Out" input = "eq_band_1:In" }
                    { output = "eq_band_1:Out" input = "eq_band_2:In" }
                    { output = "eq_band_2:Out" input = "eq_band_3:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name   = "effect_input.bta_bass_eq"
                media.class = Audio/Sink
                filter.smart = true
                filter.smart.name = "bta-bass-eq"
                filter.smart.target = { node.name = "bluez_output.02_00_00_00_00_02.1" }
            }
            playback.props = {
                node.name    = "effect_output.bta_bass_eq"
                node.passive = true
            }
        }
    }
]
