# bt-audio-hifi (PRD-BTA01 F1.4) — Bluetooth ses cihazı BAĞLANDIĞINDA varsayılan çıkışı ona geri al.
#
# Neden: kulaklık koptuğunda bir GNOME istemcisi `default.configured.audio.sink`'i açıkça laptop hoparlörüne
# yazıyor (ölçüldü 2026-09-27 19:15:08.536, pw-metadata izleme); kulaklık geri geldiğinde WirePlumber
# "configured" hoparlörü korur → ses kulaklığa DÖNMEZ.
#
# Kaynak (PipeWire 1.6.8 module-switch-on-connect.c): PCI/ISA dahili cihazlar zaten hariç (yalnız HDMI sink'ler
# istisna); cihaz kartı olmayanlar (RAOP/AirPlay) hariç; sanal düğümler varsayılan olarak hariç. `blocklist`
# node.name'e POSIX ERE ile uygulanır → `^alsa_|hdmi` = USB dock dahil tüm ALSA ve HDMI dışarıda, yalnız bluez_*.
pulse.cmd = [
    { cmd = "load-module" args = "module-switch-on-connect blocklist=^alsa_|hdmi" flags = [ ] }
]
